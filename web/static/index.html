<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldEdit 3D 模拟器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23181b22'/><rect x='2' y='2' width='12' height='12' fill='%235b8cff'/></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <header>
        <h1>WorldEdit 3D</h1>
        <p class="sub">本地模拟器 · WorldEdit-CLI</p>
      </header>

      <section class="panel">
        <div class="panel-title">
          <span>投影文件 <em id="fileCount">0</em></span>
          <div class="title-actions">
            <button id="newBtn" class="icon-btn" title="新建空白投影">＋</button>
            <button id="uploadBtn" class="icon-btn" title="上传 .schem">↑</button>
            <button id="refreshBtn" class="icon-btn" title="刷新">↻</button>
          </div>
        </div>
        <div class="file-tools">
          <input id="fileSearch" type="search" placeholder="搜索文件…" autocomplete="off">
          <select id="fileSort" title="排序">
            <option value="name">名称</option>
            <option value="mtime">修改时间</option>
          </select>
        </div>
        <ul id="fileList" class="file-list"></ul>
        <button id="revealBtn" class="link">打开文件夹</button>
        <input id="fileInput" type="file" accept=".schem" hidden>
      </section>

      <section class="panel stats">
        <div class="stat"><span>尺寸</span><b id="statSize">—</b></div>
        <div class="stat"><span>方块</span><b id="statBlocks">—</b></div>
        <div class="stat"><span>DataVersion</span><b id="statVersion">—</b></div>
        <div class="stat"><span>状态</span><b id="statStatus">未载入</b></div>
      </section>

    </aside>

    <main id="main">
      <canvas id="view"></canvas>


      <div id="hud" class="hidden">
        <span id="hudInfo"></span>
        <select id="viewSelect" class="view-select" title="工程视角">
          <option value="iso">等轴测</option>
          <option value="front">前视</option>
          <option value="back">后视</option>
          <option value="left">左视</option>
          <option value="right">右视</option>
          <option value="top">顶视</option>
          <option value="bottom">底视</option>
        </select>
        <button id="fitBtn" class="ghost small">等轴测</button>
        <button id="shotBtn" class="ghost small">截图</button>
      </div>

      <section id="console" class="hidden">
        <div class="console-head">
          <span class="title">命令</span>
          <div class="actions">
            <button id="exampleBtn" class="ghost small">示例</button>
            <button id="runBtn" class="primary small">运行 Ctrl+Enter</button>
            <button id="saveBtn" class="ghost small">保存</button>
            <button id="saveAsBtn" class="ghost small">另存为</button>
            <button id="downloadBtn" class="ghost small">下载</button>
            <button id="resetBtn" class="ghost small">重置</button>
            <button id="closeBtn" class="ghost small">关闭</button>
          </div>
        </div>
        <div class="console-body">
          <textarea id="commands" spellcheck="false"></textarea>
          <pre id="log"></pre>
        </div>
      </section>

      <div id="dropHint" class="hidden">松开载入 .schem</div>
      <div id="busy" class="hidden"><div class="spinner"></div><span id="busyText">处理中…</span></div>
      <div id="toasts" class="toasts"></div>
      <dialog id="modal" class="modal"></dialog>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
