<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldEdit 3D 模拟器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23181b22'/><rect x='2' y='2' width='12' height='12' fill='%235b8cff'/></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <header>
        <h1>WorldEdit 3D</h1>
        <p class="sub">本地模拟器 · WorldEdit-CLI</p>
      </header>

      <section class="panel">
        <div class="panel-title">
          <span>投影文件</span>
          <button id="uploadBtn" class="ghost" title="上传 .schem">上传</button>
        </div>
        <ul id="fileList" class="file-list"></ul>
        <input id="fileInput" type="file" accept=".schem" hidden>
      </section>

      <section class="panel stats">
        <div class="stat"><span>尺寸</span><b id="statSize">-</b></div>
        <div class="stat"><span>方块</span><b id="statBlocks">-</b></div>
        <div class="stat"><span>DataVersion</span><b id="statVersion">-</b></div>
        <div class="stat"><span>状态</span><b id="statStatus">-</b></div>
      </section>

      <section class="panel help">
        <p><b>左键</b> 旋转 · <b>右键</b> 平移 · <b>滚轮</b> 缩放</p>
        <p>点击方块查看名称和坐标</p>
        <p class="muted">结果只写入 work/current.schem，原文件不变</p>
      </section>
    </aside>

    <main id="main">
      <canvas id="view"></canvas>

      <div id="hud">
        <span id="hudInfo">拖动鼠标查看</span>
        <button id="fitBtn" class="ghost small">视角复位</button>
      </div>

      <section id="console">
        <div class="console-head">
          <span class="title">命令</span>
          <div class="actions">
            <button id="exampleBtn" class="ghost small">示例</button>
            <button id="runBtn" class="primary small">运行 Ctrl+Enter</button>
            <button id="resetBtn" class="ghost small">重置</button>
            <button id="downloadBtn" class="ghost small">下载</button>
            <button id="saveBtn" class="ghost small">另存为</button>
          </div>
        </div>
        <div class="console-body">
          <textarea id="commands" spellcheck="false" placeholder="//pos1 0,0,0&#10;//pos2 12,7,12&#10;//replace minecraft:oak_planks minecraft:birch_planks&#10;//replace minecraft:spruce_planks minecraft:gold_block"></textarea>
          <pre id="log"></pre>
        </div>
      </section>

      <div id="dropHint" class="hidden">松开载入 .schem</div>
      <div id="busy" class="hidden"><div class="spinner"></div><span id="busyText">处理中…</span></div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
